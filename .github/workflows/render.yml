name: GRIDLOOP production episode

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/run-now"
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: gridloop-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FPS: "30"
      DURATION: "24"
      MAX_RENDER_ATTEMPTS: "3"
      YOUTUBE_UPLOAD_ENABLED: ${{ (secrets.YOUTUBE_CLIENT_ID != '') && (secrets.YOUTUBE_CLIENT_SECRET != '') && (secrets.YOUTUBE_REFRESH_TOKEN != '') }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Produce, QC and optionally upload episode
        run: python main.py

      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridloop-episode
          path: output/
          if-no-files-found: warn
          retention-days: 7

      - name: Save uploaded career progression
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add career_state.json
          if git diff --cached --quiet; then
            echo "Career unchanged (preview mode or scheduled run skipped)."
          else
            git commit -m "Advance GRIDLOOP career after upload [skip ci]"
            git push
          fi
