name: Render racing short

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/run-now"
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render short
        env:
          FPS: "30"
          DURATION: "24"
        run: python main.py

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: racing-short
          path: output/
          if-no-files-found: error
          retention-days: 7

      - name: Save progression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "Advance racing progression [skip ci]"
            git push
          fi
