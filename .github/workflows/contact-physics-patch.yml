name: Apply contact physics upgrade

on:
  push:
    paths:
      - "tools/contact_physics_upgrade.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply staged physics upgrades
        run: python tools/contact_physics_upgrade.py
      - name: Push commits
        run: git push
