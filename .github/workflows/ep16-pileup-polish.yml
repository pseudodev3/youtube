name: Apply EP16 pileup polish

on:
  push:
    paths:
      - ".github/workflows/ep16-pileup-polish.yml"
      - "tools/ep16_pileup_polish.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply EP16 physics and readability polish
        run: python tools/ep16_pileup_polish.py
      - name: Validate Python
        run: python -m py_compile race_engine.py renderer.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add race_engine.py renderer.py
          git commit -m "Polish multi-car pileups and aftermath" || exit 0
          git push
