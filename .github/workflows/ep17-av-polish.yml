name: Apply EP17 camera audio music polish

on:
  push:
    paths:
      - ".github/workflows/ep17-av-polish.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply EP17 AV polish
        run: python tools/ep17_camera_audio_music.py
      - name: Validate Python
        run: python -m py_compile main.py audio.py renderer.py race_engine.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py audio.py renderer.py
          git commit -m "Polish impact camera audio and add procedural music"
          git push
