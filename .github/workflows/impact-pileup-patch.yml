name: Apply impact and pileup tuning

on:
  push:
    paths:
      - ".github/workflows/impact-pileup-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply patch
        run: python tools/impact_pileup_patch.py
      - name: Validate Python
        run: python -m py_compile race_engine.py renderer.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add race_engine.py renderer.py
          git commit -m "Strengthen impacts and add chain-reaction pileups"
          git push
