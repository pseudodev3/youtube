name: GRIDLOOP map rebuild previews

on:
  push:
    branches:
      - map-rebuild
    paths:
      - "cpp/**"
      - "native_map_runtime.py"
      - "renderer.py"
      - "renderer_enhanced.py"
      - "renderer_enhanced/**"
      - "renderer_hybrid.py"
      - "track_system.py"
      - "race_engine.py"
      - "audio.py"
      - "tools/render_map_previews.py"
      - ".github/workflows/map-preview.yml"

permissions:
  contents: read

concurrency:
  group: gridloop-map-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FPS: "24"
      DURATION: "8"
      GRIDLOOP_OUTPUT_DIR: "output/map-previews"
      YOUTUBE_UPLOAD_ENABLED: "false"
      YOUTUBE_PRIVACY_STATUS: "private"

    steps:
      - name: Checkout map rebuild branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core g++
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build native C++ map engine
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra cpp/map_engine.cpp -o cpp/map_engine
          chmod +x cpp/map_engine
          for track in training country mountain canyon night_city coast forest desert; do
            ./cpp/map_engine "$track" 120001 4 24 > "/tmp/$track.txt"
            grep -q '^S|' "/tmp/$track.txt"
            grep -q '^P|' "/tmp/$track.txt"
          done

      - name: Verify preview cannot upload
        run: |
          python - <<'PY'
          import os
          assert os.environ["YOUTUBE_UPLOAD_ENABLED"] == "false"
          from youtube_upload import upload_enabled
          assert upload_enabled() is False
          print("Upload disabled: preview workflow is safe.")
          PY

      - name: Render four controlled map previews
        run: python tools/render_map_previews.py

      - name: Verify career state was untouched
        run: git diff --exit-code -- career_state.json

      - name: Upload comparison artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gridloop-map-rebuild-previews
          path: output/map-previews/
          if-no-files-found: error
          retention-days: 7
