name: Patch GRIDLOOP country road visuals

on:
  push:
    paths:
      - ".github/workflows/patch-country-theme.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Country Roads visually distinct
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("renderer.py")
          s = p.read_text()

          old = '        "country":((116,174,224),(81,111,122),(78,139,72)),'
          new = '        "country":((158,205,232),(104,132,92),(119,156,76)),'
          if old not in s:
              raise SystemExit("country palette target not found")
          s = s.replace(old, new, 1)

          old = '        d.polygon([(c0-half0-shoulder,y0),(c0+half0+shoulder,y0),(c1+half1+shoulder,y1),(c1-half1-shoulder,y1)],fill=(204,204,196,255))'
          new = '        shoulder_fill=(189,166,112,255) if theme=="country" else (204,204,196,255)\n        d.polygon([(c0-half0-shoulder,y0),(c0+half0+shoulder,y0),(c1+half1+shoulder,y1),(c1-half1-shoulder,y1)],fill=shoulder_fill)'
          if old not in s:
              raise SystemExit("shoulder target not found")
          s = s.replace(old, new, 1)

          marker = '    if abs(frame.road_curve)>.45:\n'
          overlay = '''    if theme=="country":
        # Rural roadside identity: timber fencing, hedges and small trees move with perspective.
        for k in range(12):
            p=((k/12)+(frame.t*(.10+frame.player.speed*.07)))%1.0
            if p<.16:
                continue
            y=horizon_y+(p**1.72)*(H-horizon_y)
            half=(65+(p**1.28)*ROAD_BOTTOM)*width_mul
            center=_road_center(p,frame,cam_x)
            size=7+30*p
            for side in (-1,1):
                x=center+side*(half+90+64*p)
                post_h=size*2.2
                d.rectangle([x-size*.10,y-post_h,x+size*.10,y+size*.15],fill=(104,75,43,245))
                d.line([(x-size*1.35,y-post_h*.72),(x+size*1.35,y-post_h*.72)],fill=(126,91,53,220),width=max(2,int(size*.14)))
                d.line([(x-size*1.35,y-post_h*.35),(x+size*1.35,y-post_h*.35)],fill=(126,91,53,210),width=max(2,int(size*.12)))
                if k%3==0:
                    trunk_h=size*1.9
                    tx=x+side*size*1.8
                    d.rectangle([tx-size*.13,y-trunk_h,tx+size*.13,y],fill=(91,65,40,235))
                    crown_y=y-trunk_h-size*.60
                    d.ellipse([tx-size*.85,crown_y-size*.65,tx+size*.85,crown_y+size*.65],fill=(55,118,62,245))
                    d.ellipse([tx-size*.55,crown_y-size*1.05,tx+size*.60,crown_y+size*.35],fill=(67,137,70,235))

'''
          if marker not in s:
              raise SystemExit("country overlay insertion target not found")
          s = s.replace(marker, overlay + marker, 1)
          p.write_text(s)
          PY

          rm .github/workflows/patch-country-theme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renderer.py .github/workflows/patch-country-theme.yml
          git commit -m "Make Country Roads visually distinct [skip ci]"
          git push
