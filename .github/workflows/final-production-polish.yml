name: Apply final production visual polish

on:
  push:
    paths:
      - ".github/workflows/final-production-polish.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply polish
        run: python tools/final_production_visual_polish.py
      - name: Validate renderer
        run: python -m py_compile renderer.py
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renderer.py
          git commit -m "Polish themed roadsides and story hook sizing"
          git push
